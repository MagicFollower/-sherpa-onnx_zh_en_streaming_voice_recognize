[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lasr-local"
version = "0.1.0"
description = "LASR 1.0 本地离线实时语音识别后端"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1", "starlette==0.50.0", "uvicorn==0.53.0",
  "websockets==17.1", "sherpa-onnx==1.13.8", "numpy==2.3.5",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1", "pytest==9.1.1", "pytest-asyncio==1.4.0",
  "pytest-cov", "ruff", "onnx==1.23.0", "cryptography",
]

[project.scripts]
lasr = "lasr.cli:main"

[tool.setuptools.packages.find]
include = ["lasr*"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not real_asr'"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["real_asr: 必须使用本地真实模型，缺少制品明确失败"]
cache_dir = "../.cache/backend/pytest"

[tool.coverage.run]
source = ["lasr"]
branch = true
data_file = "../.cache/backend/.coverage"

[tool.coverage.html]
directory = "../.cache/backend/coverage-html"

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = "../.cache/backend/ruff"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
